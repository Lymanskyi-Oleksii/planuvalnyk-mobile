[package]
name = "planuvalnyk"
version = "0.1.0"
description = "Планувальник дня"
edition = "2021"

[lib]
name = "planuvalnyk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-notification = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
